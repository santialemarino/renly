[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "renly-api"
version = "0.1.0"
description = "Renly FastAPI backend"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.135.0",
    "uvicorn[standard]>=0.32.0",
    "slowapi>=0.1.9",
    "sqlmodel>=0.0.22",
    "asyncpg>=0.30.0",
    "greenlet>=3.0.0",
    "pydantic[email]>=2.6.0",
    "pydantic-settings>=2.6.0",
    "alembic>=1.14.0",
    "httpx>=0.28.0",
    "apscheduler>=3.10.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "yfinance>=1.2.0",
    "openpyxl>=3.1.5",
    "pdfplumber>=0.11.0",
    "numpy<2.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[dependency-groups]
dev = ["ruff>=0.8.0"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 150
target-version = "py313"
# Alembic-generated migration files are not hand-written; don't lint/format them.
# force-exclude so the exclusion also applies when pre-commit/lint-staged passes explicit paths.
extend-exclude = ["migrations"]
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
# I = isort (import sorting)
