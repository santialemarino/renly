name: CI Web E2E

run-name: 'CI Web E2E by @${{ github.actor }}'

# When the suite runs:
#   * on a PR, if it touches the FLOOR (the paths in the `changes` job below: schema, migrations,
#     dependency manifests, the e2e harness itself) or carries the `run-e2e` label, which the author
#     adds by judgment — the e2e-testing skill has the rubric;
#   * every night on main (`schedule`), which opens or updates one `e2e-red` issue when it fails (or
#     does not finish) and closes it when a later night is green;
#   * on demand (`workflow_dispatch`); on main it can also update the `e2e-red` issue as the nightly
#     does — how a fix is confirmed before the next night.
#
# The workflow itself triggers on EVERY PR, and the gate is at JOB level, deliberately: `e2e-required`
# is the check to mark required, and a required check has to report on every PR. An `on.paths`
# filter would leave it pending forever on a PR it skipped; a skipped job inside a run that reports
# does not. No base-branch filter either, so a PR stacked on another branch gets the same gate.
# `labeled` is in the PR types so that adding `run-e2e` starts a run.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      report:
        description: 'Also update the e2e-red issue, as the nightly run does'
        type: boolean
        default: false

# A new push (or label) on a PR supersedes the run in flight; every run on the same commit reaches the
# same gate decision, so the replacement stands in for it fully. Other events run to the end.
concurrency:
  group: ci-web-e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only by default. The two jobs that need more (`changes` reads the PR's file list, the nightly
# report writes an issue) widen it for themselves only.
permissions:
  contents: read

env:
  # The same role split as local dev and production: requests on the RLS-subject renly_app, the
  # scheduler, migrations and auth bootstrap on the BYPASSRLS renly_admin. Both roles come from
  # database/00_roles.sql, which `pnpm db:init` applies. The database is compose's own `renly`.
  DATABASE_URL: postgresql+asyncpg://renly_app:renly_app@localhost:5432/renly
  DATABASE_ADMIN_URL: postgresql+asyncpg://renly_admin:renly_admin@localhost:5432/renly
  EMAIL_PROVIDER: console
  NEXT_PUBLIC_API_URL: http://localhost:8000
  NEXTAUTH_URL: http://localhost:3000
  PLAYWRIGHT_BASE_URL: http://localhost:3000
  E2E_API_URL: http://localhost:8000
  # Throwaway accounts that exist only inside this job's database: the harness account, and an admin
  # one for the admin pages, which show anyone else the not-found page.
  E2E_EMAIL: e2e-ci@example.com
  E2E_ADMIN_EMAIL: e2e-ci-admin@example.com

jobs:
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      floor: ${{ steps.filter.outputs.floor }}
      run_e2e: ${{ steps.labels.outputs.run_e2e }}
    steps:
      # The PR's labels as they are NOW, not as the event payload recorded them. "Re-run all jobs" on
      # an older run replays that run's payload; read from it, a run from before `run-e2e` was added
      # would skip the suite and report a green `e2e-required` over a labelled run that went red.
      - id: labels
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.issues.listLabelsOnIssue({
              ...context.repo,
              issue_number: context.payload.pull_request.number,
            });
            core.setOutput('run_e2e', String(data.some((label) => label.name === 'run-e2e')));

      # Reads the PR's changed files through the API, so no checkout is needed.
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            floor:
              - 'apps/api/database/**'
              - 'apps/api/migrations/**'
              - 'apps/api/alembic.ini'
              - 'pnpm-lock.yaml'
              - '**/package.json'
              - 'pnpm-workspace.yaml'
              - 'apps/api/pyproject.toml'
              - 'apps/api/uv.lock'
              - '.nvmrc'
              - '.github/workflows/ci.web-e2e.yml'
              - 'apps/web/playwright.config.ts'
              - 'apps/web/tests/e2e/**'
              - 'scripts/db-init.mjs'
              - 'docker-compose.yml'

  e2e-web:
    needs: changes
    # `always()` so a skipped `changes` (schedule, dispatch) does not skip this job too; on a PR it
    # still requires `changes` to have succeeded.
    if: >-
      always() && (
        github.event_name == 'schedule' ||
        github.event_name == 'workflow_dispatch' ||
        (needs.changes.result == 'success' && (
          needs.changes.outputs.floor == 'true' ||
          needs.changes.outputs.run_e2e == 'true'
        ))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        run: pip install uv

      - name: Generate this run's secrets
        # The JWT secret the API signs with and NextAuth verifies with must be equal and 32+ chars;
        # the passwords are the throwaway accounts'. All live only for this job. `add-mask` hides them
        # in the job LOG only: a failed test's trace (uploaded below) records the requests it made,
        # so it can hold the harness session's bearer token (specs read it from the saved session, and
        # none sends the password) — which is harmless, because the account and the database it lives
        # in are discarded with the runner.
        run: |
          secret="$(openssl rand -hex 32)"
          password="$(openssl rand -hex 16)"
          admin_password="$(openssl rand -hex 16)"
          echo "::add-mask::$secret"
          echo "::add-mask::$password"
          echo "::add-mask::$admin_password"
          {
            echo "JWT_SECRET=$secret"
            echo "NEXTAUTH_SECRET=$secret"
            echo "E2E_PASSWORD=$password"
            echo "E2E_ADMIN_PASSWORD=$admin_password"
          } >> "$GITHUB_ENV"

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile

      - name: Install API dependencies
        working-directory: apps/api
        run: uv sync --no-install-project

      - name: Initialize the database
        # The local flow, unchanged: compose's Postgres, then 00_roles.sql, 01_create_tables.sql and
        # an Alembic stamp.
        run: pnpm db:init

      - name: Build UI package
        run: pnpm build:ui

      - name: Build web
        # A production build, so no test's budget is spent compiling a route on first request.
        run: pnpm build:web

      - name: Seed exchange rates
        # The API fetches live rates at startup, from external providers. These rows make the run
        # independent of them: today's are the fallback a provider outage would otherwise leave
        # missing (a successful fetch replaces them — same date and pair), and the older month's are
        # rates NO fetch writes, so the card charges dated then convert differently in their own month
        # than today. That difference is what gives the conversion-basis spec something to catch.
        # Seeded before any API starts, because the API caches the rates it reads.
        run: |
          today="$(date -u +%F)"
          past="$(date -u -d '3 months ago' +%F)"
          docker exec renly-postgres psql -v ON_ERROR_STOP=1 -U renly -d renly -c "
            insert into exchange_rates (date, pair, rate, source) values
              ('$today', 'USD_ARS_OFICIAL', 1500, 'ci-seed'),
              ('$today', 'USD_ARS_MEP', 1550, 'ci-seed'),
              ('$today', 'USD_ARS_BLUE', 1560, 'ci-seed'),
              ('$today', 'USD_BRL', 5.2, 'ci-seed'),
              ('$today', 'USD_EUR', 0.88, 'ci-seed'),
              ('$today', 'USD_GBP', 0.75, 'ci-seed'),
              ('$past', 'USD_ARS_OFICIAL', 1000, 'ci-seed'),
              ('$past', 'USD_ARS_MEP', 1050, 'ci-seed'),
              ('$past', 'USD_ARS_BLUE', 1060, 'ci-seed')
            on conflict (date, pair) do nothing"

      - name: Create the harness account
        # The authenticated specs run as a real account and assume what a lived-in one has, so this
        # gives the throwaway one exactly that: verified; two display currencies (ARS, USD); a card
        # owing a USD and an ARS charge from three months ago plus a USD one from today; and more
        # expenses than one page holds, so the list renders its pager (the filler is dated in the
        # past so an expense a spec adds today still lands on page one).
        #
        # The card carries BOTH currencies because the conversion-basis spec checks each display
        # currency in turn, and a bucket already in the display currency is never converted: with
        # USD charges only, the USD pass could not fail. Each pass needs a bucket in the OTHER
        # currency, dated where the seeded rate differs from today's.
        #
        # Registration needs SIGNUP_MODE=open, but the invite-gate spec needs the launch default
        # (invite) — so this runs against a short-lived open-mode API, stopped before the real one.
        working-directory: apps/api
        env:
          SIGNUP_MODE: open
        run: |
          nohup uv run uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/api-signup.log 2>&1 &
          echo $! > /tmp/api-signup.pid
          timeout 60 bash -c 'until curl -sf http://localhost:8000/health > /dev/null; do sleep 1; done'

          api() { curl -sf -X "$1" "http://localhost:8000$2" -H 'content-type: application/json' "${@:3}"; }

          api POST /auth/register -d "$(jq -n --arg e "$E2E_EMAIL" --arg p "$E2E_PASSWORD" \
            '{name: "E2E CI", email: $e, password: $p, language: "en"}')" > /dev/null
          docker exec renly-postgres psql -v ON_ERROR_STOP=1 -U renly -d renly \
            -c "update users set email_verified_at = now() where email = '$E2E_EMAIL'"

          token="$(api POST /auth/login -d "$(jq -n --arg e "$E2E_EMAIL" --arg p "$E2E_PASSWORD" \
            '{email: $e, password: $p}')" | jq -r .access_token)"
          echo "::add-mask::$token"
          authed() { api "$@" -H "Authorization: Bearer $token"; }

          authed PUT /settings -d '{"primary_currency": "ARS", "secondary_currency": "USD"}' > /dev/null
          card="$(authed POST /credit-cards \
            -d '{"name": "E2E card", "closing_day": 25, "due_day": 5, "currency": "USD"}' | jq -r .id)"
          charge() {
            authed POST /expenses -d "$(jq -n --arg d "$1" --arg a "$2" --arg cur "$3" --argjson c "$card" \
              '{date: $d, amount: $a, currency: $cur, payment_method: "credit_card", credit_card_id: $c}')" \
              > /dev/null
          }
          charge "$(date -u -d '3 months ago' +%F)" 200.00 USD
          charge "$(date -u -d '3 months ago' +%F)" 150000.00 ARS
          charge "$(date -u +%F)" 123.45 USD

          filler_date="$(date -u -d '45 days ago' +%F)"
          for i in $(seq 1 30); do
            authed POST /expenses -d "$(jq -n --arg d "$filler_date" --arg a "$((1000 + i))" \
              '{date: $d, amount: $a, currency: "ARS", payment_method: "cash"}')" > /dev/null
          done

          # A live signup invite, so the accessibility sweep scans the invited registration form and
          # not only the invite-only notice. The API stores only an invite's SHA-256 and emails the raw
          # token, so a run cannot ask for one: it is minted here, its hash inserted, and the raw value
          # handed to the suite as E2E_SIGNUP_INVITE_TOKEN. The address is not the harness account's,
          # so nothing a spec does ever consumes it.
          invite_token="$(openssl rand -hex 24)"
          echo "::add-mask::$invite_token"
          invite_hash="$(printf '%s' "$invite_token" | sha256sum | cut -d' ' -f1)"
          docker exec renly-postgres psql -v ON_ERROR_STOP=1 -U renly -d renly -c "
            insert into invites (email, token_hash, invited_by, expires_at)
            select 'e2e-invited@example.com', '$invite_hash', id, (now() at time zone 'utc') + interval '30 days'
            from users where email = '$E2E_EMAIL'"
          echo "E2E_SIGNUP_INVITE_TOKEN=$invite_token" >> "$GITHUB_ENV"

          # The admin account, for the accessibility scans of /admin and /admin/feedback. Registered
          # like the harness one, then verified and flagged `is_admin` in SQL — the only way an account
          # becomes an admin. Its pages need something to list: the invite above already shows on
          # /admin, and one feedback row per category (from the harness account) puts the feedback
          # table and every category badge in the scan instead of the empty state.
          api POST /auth/register -d "$(jq -n --arg e "$E2E_ADMIN_EMAIL" --arg p "$E2E_ADMIN_PASSWORD" \
            '{name: "E2E CI admin", email: $e, password: $p, language: "en"}')" > /dev/null
          docker exec renly-postgres psql -v ON_ERROR_STOP=1 -U renly -d renly -c "
            update users set email_verified_at = now(), is_admin = true where email = '$E2E_ADMIN_EMAIL';
            insert into feedback (user_id, category, message)
            select id, category::feedback_category, 'E2E seeded ' || category || ' feedback'
            from users, unnest(array['bug', 'idea', 'question', 'other']) as category
            where email = '$E2E_EMAIL'"

          kill "$(cat /tmp/api-signup.pid)"
          timeout 30 bash -c 'while curl -s http://localhost:8000/health > /dev/null; do sleep 1; done'

      - name: Start API
        working-directory: apps/api
        run: nohup uv run uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/api.log 2>&1 &

      - name: Start web
        run: nohup pnpm --filter web start > /tmp/web.log 2>&1 &

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter web exec playwright install-deps chromium

      - name: Wait for API and web
        run: |
          timeout 120 bash -c 'until curl -sf http://localhost:8000/health > /dev/null; do sleep 1; done'
          timeout 120 bash -c 'until curl -sf http://localhost:3000/api/auth/providers > /dev/null; do sleep 1; done'

      - name: Run e2e suite
        run: pnpm --filter web test:e2e

      - name: Require a full run
        # A green run that quietly ran less is the failure this step exists for, and the suite exits
        # 0 in each of these: E2E_EMAIL / E2E_PASSWORD missing (no authenticated project at all), a
        # project whose testMatch stops matching (it exists and runs nothing), a spec file that
        # matches neither project, and the harness seed missing (the conversion-basis check skips
        # itself). So the population is DERIVED from the spec files on disk, not from the config:
        # every `*.auth.spec.ts` must have executed at least one test in `chromium-authenticated`,
        # every other `*.spec.ts` at least one in `chromium`, and nothing anywhere may skip.
        run: |
          report=apps/web/test-results/results.json
          failed=0
          while IFS= read -r file; do
            case "$file" in
              *.auth.spec.ts) project=chromium-authenticated ;;
              *) project=chromium ;;
            esac
            ran="$(jq --arg f "$file" --arg p "$project" '[.suites[] | select(.file == $f) | .. | objects
              | select(.projectName? == $p and .status != "skipped" and (.results | length) > 0)] | length' "$report")"
            if [ "$ran" -eq 0 ]; then
              echo "::error::$file executed no test in the $project project."
              failed=1
            fi
          done < <(cd apps/web/tests/e2e && find . -name '*.spec.ts' | sed 's|^\./||' | sort)
          skipped="$(jq '.stats.skipped' "$report")"
          if [ "$skipped" -ne 0 ]; then
            echo "::error::$skipped test(s) skipped; CI must run the whole suite."
            failed=1
          fi
          exit "$failed"

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 14

      - name: Upload test results (traces, screenshots, videos)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: apps/web/test-results/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload server logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-server-logs
          path: /tmp/*.log
          retention-days: 14

  # The one check to mark REQUIRED. It reports on every run and fails only when a job it needs failed
  # or was cancelled — so a PR whose gate skipped `e2e-web` passes, and one where it ran and broke
  # does not.
  e2e-required:
    needs: [changes, e2e-web]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if a needed job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "::error::changes: ${{ needs.changes.result }}, e2e-web: ${{ needs.e2e-web.result }}"
          exit 1
      - run: 'echo "changes: ${{ needs.changes.result }}, e2e-web: ${{ needs.e2e-web.result }}"'

  # The nightly net's memory: one open `e2e-red` issue while main's nightly run is red, updated on
  # each further red night and closed by the first green one. A dispatch with `report` ticked does the
  # same, but ONLY on main — the issue is about main, and a run on any other branch says nothing about
  # it. Nothing else in the workflow can write.
  #
  # On `schedule` a CANCELLED suite counts as red: nothing cancels a nightly run but its own job
  # timeout (or a person), and a night that never finished is not a green one. On a dispatch it is
  # left alone, since there the person who cancelled it is watching.
  nightly-report:
    needs: e2e-web
    if: >-
      always() && (
        (github.event_name == 'schedule' &&
          contains(fromJSON('["success", "failure", "cancelled"]'), needs.e2e-web.result)) ||
        (github.event_name == 'workflow_dispatch' && inputs.report && github.ref == 'refs/heads/main' &&
          contains(fromJSON('["success", "failure"]'), needs.e2e-web.result))
      )
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v7
        env:
          RESULT: ${{ needs.e2e-web.result }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const { data: open } = await github.rest.issues.listForRepo({
              owner, repo, labels: 'e2e-red', state: 'open', per_page: 1,
            });
            const issue = open[0];
            const result = process.env.RESULT;
            if (result === 'failure' || result === 'cancelled') {
              const outcome = result === 'failure' ? 'failed' : 'did not finish (cancelled or timed out)';
              const line = `The ${context.eventName} e2e run on \`main\` ${outcome}: ${runUrl}`;
              if (issue) {
                await github.rest.issues.createComment({ owner, repo, issue_number: issue.number, body: line });
              } else {
                await github.rest.issues.create({
                  owner, repo, title: 'Nightly e2e is red on main', labels: ['e2e-red'],
                  body: `${line}\n\nClosed automatically by the first green nightly run.`,
                });
              }
            } else if (issue) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: issue.number, body: `Green again on \`main\`: ${runUrl}`,
              });
              await github.rest.issues.update({ owner, repo, issue_number: issue.number, state: 'closed' });
            }
