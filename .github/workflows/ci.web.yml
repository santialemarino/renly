name: CI Web

run-name: 'CI Web by @${{ github.actor }}'

on:
  # Every merge to main runs the whole suite, whatever it touched.
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'turbo.json'
      - 'pnpm-workspace.yaml'
      - '.nvmrc'
      - '.github/workflows/ci.web.yml'
      # The format check runs Prettier over the whole tree, so every file it formats has to trigger it:
      # docs, skills, workflow YAML, root markdown and the root scripts included, plus its own config.
      - 'prettier.config.mjs'
      - '.prettierignore'
      - '**.md'
      - '**.mjs'
      - '**.json'
      - '**.yml'
      - '**.yaml'
      # Cross-app parity tests (`*.cross-app.test.ts`) read the API app's source, so an API-only change
      # can break this suite. Widening the filter costs ~2 min of parallel runner time, no wall-clock.
      - 'apps/api/**'
  workflow_dispatch:

jobs:
  ci-web:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Prettier over the whole tree, as the pre-commit hook runs it on staged files: a commit made
      # without the hook would otherwise land unformatted.
      - name: Format check
        run: pnpm format:check:web

      - name: Lint
        run: pnpm --filter web run lint

      - name: Lint UI package
        run: pnpm --filter @repo/ui run lint

      - name: Type check
        run: pnpm --filter web run check-types

      - name: Type check UI package
        run: pnpm --filter @repo/ui run check-types

      - name: Unit tests
        run: pnpm --filter web run test:run

      - name: Build UI package
        run: pnpm build:ui

      - name: Build web
        run: pnpm build:web
