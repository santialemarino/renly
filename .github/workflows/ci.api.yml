name: CI API

run-name: 'CI API by @${{ github.actor }}'

# Runs on EVERY PR to main, with no `on.paths` filter: `ci-api` is a check to mark required, and a
# required check has to report on every PR — a workflow a paths filter skipped would leave it pending
# forever. What it RUNS is decided by the `changes` job instead, from the PR's changed files, with the
# same rules as the pre-commit hook (`scripts/pre-commit.sh`):
#   * full — anything the API side reads changed (`apps/api/**`, `docs/public/api-reference.md`, whose
#     routes the suite asserts), any workflow or `docker/api.Dockerfile` (`test_uv_version_pin.py`
#     holds the uv each of them installs to one version), or a root file both sides read (root
#     `package.json`, scripts, docker, …); and on every push to main and every dispatch, whatever they
#     touched — integration suites included.
#   * cross-app — only the web side changed (`apps/web/**`, `packages/**`, the lockfile and workspace
#     files, `tsconfig*`): Ruff plus the suite's cross-app tests (`pytest -m cross_app`), the ones that
#     read the web app's source, with no database. An untagged one fails the suite's own tag guard.
#   * none — nothing but docs, skills and markdown: the suite job is skipped, and `ci-api` passes.
# The suite runs in `api-tests`; `ci-api`, the required check, is a separate job that always runs and
# reads its result, because a required check that is itself skipped reads as passed.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
    steps:
      # The PR's changed files from the API (a renamed file counts under both names, as the hook sees
      # it), so no checkout is needed.
      - name: List the changed files
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/${{ github.event.pull_request.number }}/files" \
            --jq '.[] | .filename, (.previous_filename // empty)' > /tmp/changed-files.txt
          cat /tmp/changed-files.txt

      - id: mode
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo "mode=full" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          api=0
          web=0
          while IFS= read -r path; do
            case "$path" in
              apps/api/* | docs/public/api-reference.md) api=1 ;;
              apps/web/* | packages/* | pnpm-lock.yaml | pnpm-workspace.yaml | turbo.json | tsconfig*) web=1 ;;
              .github/workflows/* | docker/api.Dockerfile) api=1 ;;
              docs/* | .claude/* | .agents/* | .github/* | *.md | LICENSE) ;;
              *) api=1 web=1 ;;
            esac
          done < /tmp/changed-files.txt
          if [ "$api" = 1 ]; then mode=full; elif [ "$web" = 1 ]; then mode=cross-app; else mode=none; fi
          echo "api=$api web=$web -> $mode"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

  api-tests:
    needs: changes
    # `always()` and the empty-mode fallback below: if `changes` itself fails, this runs the full
    # suite rather than being skipped.
    if: ${{ always() && !cancelled() && needs.changes.outputs.mode != 'none' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    # A real Postgres, built exactly as `pnpm db:init` builds the local one (00_roles.sql, then
    # 01_create_tables.sql, then an Alembic stamp), so the integration suites — RLS, money equality,
    # query counts, the bind-parameter cliff — run on every PR instead of being skipped. A cross-app
    # run needs no database, and an empty image starts no service.
    services:
      postgres:
        image: ${{ (needs.changes.outputs.mode || 'full') == 'full' && 'postgres:16-alpine' || '' }}
        env:
          POSTGRES_USER: renly
          POSTGRES_PASSWORD: renly
          POSTGRES_DB: renly
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U renly -d renly"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Request role and BYPASSRLS admin role on the CI database; every integration suite reads its own
      # var and is skipped when it is unset, so all four are set (see the testing skill).
      DATABASE_URL: postgresql+asyncpg://renly_app:renly_app@localhost:5432/renly
      DATABASE_ADMIN_URL: postgresql+asyncpg://renly_admin:renly_admin@localhost:5432/renly
      RLS_TEST_DATABASE_URL: postgresql+asyncpg://renly_app:renly_app@localhost:5432/renly
      RLS_TEST_ADMIN_DATABASE_URL: postgresql+asyncpg://renly_admin:renly_admin@localhost:5432/renly
      LEDGER_TEST_DATABASE_URL: postgresql+asyncpg://renly_admin:renly_admin@localhost:5432/renly
      GROUPS_TEST_DATABASE_URL: postgresql+asyncpg://renly_admin:renly_admin@localhost:5432/renly
      JWT_SECRET: ci-dummy-jwt-secret-min-32-chars-padding
      MODE: ${{ needs.changes.outputs.mode || 'full' }}
      # Required: the app refuses to import without it.
      ENVIRONMENT: development
      EMAIL_PROVIDER: console

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      # Pinned to the uv docker/api.Dockerfile copies in, so CI and the image read uv.lock the same way.
      - name: Install uv
        run: pip install uv==0.10.8

      # `--locked` fails when uv.lock is out of step with pyproject.toml, as the API image build does.
      - name: Install dependencies
        run: uv sync --locked --no-install-project --extra dev

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Ruff lint
        run: uv run ruff check .

      - name: Verify app imports
        if: env.MODE == 'full'
        run: uv run python -c "from app.main import app"

      - name: Initialize the database
        if: env.MODE == 'full'
        env:
          PGPASSWORD: renly
        run: |
          psql -v ON_ERROR_STOP=1 -h localhost -U renly -d renly -f database/00_roles.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U renly -d renly -f database/01_create_tables.sql
          uv run alembic stamp head

      # One copy of the database per test worker (`renly_gw0`, …), taken from the one just built: the
      # suite runs on every core with pytest-xdist, and tests/conftest.py points each worker at its own
      # copy, so no two workers share accounts, rows or query counts. Made before anything else connects,
      # since a template must have no other session open.
      - name: Copy the database for each test worker
        if: env.MODE == 'full'
        env:
          PGPASSWORD: renly
        run: |
          workers="$(nproc)"
          for i in $(seq 0 $((workers - 1))); do
            psql -v ON_ERROR_STOP=1 -q -h localhost -U renly -d postgres -c "CREATE DATABASE renly_gw$i TEMPLATE renly"
          done
          echo "TEST_WORKERS=$workers" >> "$GITHUB_ENV"

      # The schema file builds every fresh database; the migration chain upgrades every live one. This
      # replays the chain from its baseline twice — online, and as the script `alembic upgrade --sql`
      # writes, applied as renly_admin — and fails when either database differs from the one the
      # schema file built. The baseline is the schema file as it stood when Alembic was adopted (the
      # parent of the commit that added `user_plan`, which 0002 then adds): 0001 is an empty anchor, so
      # it is read from history rather than kept as a second copy in the tree.
      - name: Compare the migration chain with the schema file
        if: env.MODE == 'full'
        env:
          PGPASSWORD: renly
          BASELINE_COMMIT: 876e656a23cd9a30c1de9931b3f0201c65ea8e3f
          POSTGRES: ${{ job.services.postgres.id }}
        run: |
          git fetch --quiet --depth=1 origin "$BASELINE_COMMIT"
          git show "$BASELINE_COMMIT:apps/api/database/01_create_tables.sql" > /tmp/baseline.sql
          for db in renly_chain renly_offline; do
            psql -v ON_ERROR_STOP=1 -q -h localhost -U renly -d renly -c "CREATE DATABASE $db"
            psql -v ON_ERROR_STOP=1 -q -h localhost -U renly -d "$db" -f database/00_roles.sql
            psql -v ON_ERROR_STOP=1 -q -h localhost -U renly -d "$db" -f /tmp/baseline.sql
            DATABASE_ADMIN_URL="postgresql+asyncpg://renly_admin:renly_admin@localhost:5432/$db" \
              uv run alembic stamp 0001_baseline
          done
          DATABASE_ADMIN_URL=postgresql+asyncpg://renly_admin:renly_admin@localhost:5432/renly_chain \
            uv run alembic upgrade head
          uv run alembic upgrade 0001_baseline:head --sql > /tmp/offline.sql
          PGPASSWORD=renly_admin psql -v ON_ERROR_STOP=1 -q -h localhost -U renly_admin -d renly_offline -f /tmp/offline.sql
          for db in renly renly_chain renly_offline; do
            docker exec "$POSTGRES" pg_dump -U renly --schema-only --no-comments -d "$db" > "/tmp/$db.dump"
          done
          python3 - <<'PY'
          import difflib
          import re

          # The dump's statements, split at a `;` that ends a line OUTSIDE any quoted text. A function
          # body is one dollar-quoted string full of `;` line ends, and splitting it there would turn
          # its lines into separate "statements" that the sort below reorders — so two statements
          # swapped inside a body would compare equal. Here a body stays whole, in its own order.
          DOLLAR_TAG = re.compile(r"\$(?:[A-Za-z_][A-Za-z0-9_]*)?\$")

          def split_statements(text):
              out, start, i, quote = [], 0, 0, None
              while i < len(text):
                  if quote:
                      if text.startswith(quote, i):
                          i += len(quote)
                          quote = None
                      else:
                          i += 1
                      continue
                  tag = DOLLAR_TAG.match(text, i)
                  if tag:
                      quote = tag.group(0)
                      i += len(quote)
                  elif text[i] == "'":
                      quote = "'"
                      i += 1
                  elif text.startswith(";\n", i):
                      out.append(text[start:i])
                      i += 2
                      start = i
                  else:
                      i += 1
              out.append(text[start:])
              return out

          # A dump as a sorted list of statements, with each table's columns sorted: ADD COLUMN appends,
          # so a migrated table lists its columns in a different order than the CREATE TABLE that
          # declares them, and the order means nothing. Skipped: session settings, and the owner's own
          # default privileges, which 01_create_tables.sql declares as the owner while a replay runs as
          # renly_admin (which 00_roles.sql already gives the same defaults).
          def statements(path):
              text = "\n".join(l for l in open(path).read().splitlines() if not l.startswith(("--", "\\")))
              out = []
              for stmt in (s.strip() for s in split_statements(text)):
                  if not stmt or stmt.startswith(("SET ", "SELECT pg_catalog.set_config", "ALTER DEFAULT PRIVILEGES FOR ROLE renly ")):
                      continue
                  if stmt.startswith("CREATE TABLE"):
                      head, rest = stmt.split("(\n", 1)
                      body, tail = rest.rsplit("\n)", 1)
                      stmt = head + "(\n" + "\n".join(sorted(c.strip().rstrip(",") for c in body.splitlines())) + "\n)" + tail
                  out.append(stmt)
              return sorted(out)

          expected = statements("/tmp/renly.dump")
          tables = sum(s.startswith("CREATE TABLE") for s in expected)
          failed = tables == 0
          for db in ("renly_chain", "renly_offline"):
              diff = list(difflib.unified_diff(expected, statements(f"/tmp/{db}.dump"), "schema file", db, lineterm="", n=0))
              print(f"{db}: {len(expected)} statements, {tables} tables, {'differs' if diff else 'identical'}")
              if diff:
                  print("\n".join(diff))
              failed = failed or bool(diff)
          raise SystemExit(1 if failed else 0)
          PY

      # `--dist loadfile` keeps each test file on one worker, in its own order, so module-level state
      # (seeded accounts, rate-limit buckets, caches) behaves as in a serial run. The cross-app run below
      # stays serial: it is a few seconds, less than starting the workers.
      - name: Run tests
        if: env.MODE == 'full'
        run: uv run pytest tests/ -n "$TEST_WORKERS" --dist loadfile -v --junitxml=pytest-results.xml

      - name: Run cross-app tests
        if: env.MODE == 'cross-app'
        run: uv run pytest tests/ -m cross_app -v --junitxml=pytest-results.xml

      # Every integration suite skips itself when its database variable is missing or unusable, and a
      # skipped suite still reports green. With all four set, nothing may skip: a skip here means a suite
      # silently stopped running. On a cross-app run it holds the same: those tests need no database,
      # and a run that selected none fails too.
      - name: Require that no test was skipped
        if: always()
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("pytest-results.xml").getroot()
          suites = [root] if root.tag == "testsuite" else root.findall("testsuite")
          skipped = sum(int(s.get("skipped", 0)) for s in suites)
          total = sum(int(s.get("tests", 0)) for s in suites)
          print(f"{total} tests, {skipped} skipped")
          raise SystemExit(1 if skipped or total == 0 else 0)
          PY

  # The REQUIRED check. It always runs and passes only when `api-tests` succeeded, or when `changes`
  # succeeded and chose `none`, which skips it. A failed or cancelled suite, or one skipped for any
  # other reason (a cancelled run), fails it.
  ci-api:
    needs: [changes, api-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      # `always()` on the step too: a step's default condition is `success()`, which a cancelled run
      # turns false — the step would be skipped and the job would pass on nothing.
      - name: Require the suite
        if: always()
        env:
          CHANGES: ${{ needs.changes.result }}
          MODE: ${{ needs.changes.outputs.mode }}
          TESTS: ${{ needs.api-tests.result }}
        run: |
          echo "changes: $CHANGES ($MODE), api-tests: $TESTS"
          [ "$TESTS" = success ] || { [ "$TESTS" = skipped ] && [ "$CHANGES" = success ] && [ "$MODE" = none ]; }
