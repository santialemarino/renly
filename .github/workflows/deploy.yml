name: Deploy

# NOT ACTIVATED (INFRA-1/2 scaffolding). This pipeline is manual-only — it has no push/PR trigger,
# so merging never deploys anything. It is wired and validated so that going live is one switch.
#
# To activate at go-live:
#   1. Set the repository secrets listed on each job below.
#   2. In Railway, create the API service from this repo (root dir = repo root; it picks up
#      railway.json). In Vercel, create the web project with Root Directory = apps/web.
#   3. Either run this workflow manually (Actions → Deploy → Run workflow) or add a
#      `push: { branches: [main] }` trigger here to deploy on every merge.
run-name: 'Deploy ${{ inputs.target }} by @${{ github.actor }}'

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'What to deploy'
        type: choice
        options:
          - both
          - api
          - web
        default: both

jobs:
  # Re-use the existing checks as a gate; nothing deploys unless both pass (INFRA-2).
  ci-api:
    uses: ./.github/workflows/ci.api.yml
  ci-web:
    uses: ./.github/workflows/ci.web.yml

  deploy-api:
    # Railway (FastAPI, built from docker/api.Dockerfile via railway.json).
    # Requires secret: RAILWAY_TOKEN (a project token for the linked Railway project).
    if: ${{ inputs.target == 'both' || inputs.target == 'api' }}
    needs: [ci-api, ci-web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Railway CLI
        run: npm install -g @railway/cli
      - name: Deploy API to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --service api --detach

  deploy-web:
    # Vercel (Next.js). Requires secrets: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID.
    if: ${{ inputs.target == 'both' || inputs.target == 'web' }}
    needs: [ci-api, ci-web]
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Vercel CLI
        run: npm install -g vercel
      - name: Deploy web to Vercel (production)
        run: vercel deploy --prod --yes --token "${{ secrets.VERCEL_TOKEN }}"
